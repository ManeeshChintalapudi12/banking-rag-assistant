<g font-family="Arial"><g transform="translate(60 160)"><rect width="190" height="150" rx="18" fill="white"/><text x="24" y="48" fill="#168f82" font-size="13" font-weight="700">01</text><text x="24" y="79" fill="#13283a" font-size="17" font-weight="700">Web interface</text><text x="24" y="106" fill="#687b87" font-size="12">Live status and questions</text><text x="24" y="127" fill="#687b87" font-size="12">Responsive HTML / JS</text></g><g transform="translate(315 160)"><rect width="190" height="150" rx="18" fill="white"/><text x="24" y="48" fill="#168f82" font-size="13" font-weight="700">02</text><text x="24" y="79" fill="#13283a" font-size="17" font-weight="700">FastAPI</text><text x="24" y="106" fill="#687b87" font-size="12">POST /query</text><text x="24" y="127" fill="#687b87" font-size="12">GET /health</text></g><g transform="translate(570 160)"><rect width="220" height="150" rx="18" fill="white"/><text x="24" y="48" fill="#168f82" font-size="13" font-weight="700">03</text><text x="24" y="79" fill="#13283a" font-size="17" font-weight="700">RAG chain</text><text x="24" y="106" fill="#687b87" font-size="12">Top-k retrieval + answer</text><text x="24" y="127" fill="#687b87" font-size="12">Confidence gate</text></g><g transform="translate(855 132)"><rect width="280" height="90" rx="18" fill="#e3f5f1"/><text x="22" y="38" fill="#13283a" font-size="16" font-weight="700">FAISS vector index</text><text x="22" y="62" fill="#527068" font-size="12">Local or OpenAI embeddings</text></g><g transform="translate(855 254)"><rect width="280" height="90" rx="18" fill="#fff4d9"/><text x="22" y="38" fill="#13283a" font-size="16" font-weight="700">Policy documents</text><text x="22" y="62" fill="#756645" font-size="12">Wires · Holds · Disputes</text></g></g><g stroke="#62e8d6" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M250 235h58"/><path d="M505 235h58"/><path d="M790 205h58"/><path d="M995 225v22"/><path d="M855 300h-35v75H155v-58"/></g><text x="485" y="414" text-an